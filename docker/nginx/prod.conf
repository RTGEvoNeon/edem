# Продакшн конфигурация для эдемский-сад.рф

# Все остальные host'ы (в т.ч. старые домены) не перенаправляем на основной адрес.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# HTTP server - редирект на HTTPS
server {
    listen 80;
    server_name xn----8sbkccshgr4ce9k.xn--p1ai www.xn----8sbkccshgr4ce9k.xn--p1ai;

    # Для получения SSL сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всего остального на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS: отдельная заглушка для всех SNI/Host, кроме основного домена
# (чтобы mindale.ru не вел себя как “основной” и не редиректил).
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/xn----8sbkccshgr4ce9k.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbkccshgr4ce9k.xn--p1ai/privkey.pem;

    return 444;
}

# www → основной домен (иначе поисковики видят два одинаковых сайта)
server {
    listen 443 ssl;
    http2 on;
    server_name www.xn----8sbkccshgr4ce9k.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn----8sbkccshgr4ce9k.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbkccshgr4ce9k.xn--p1ai/privkey.pem;

    return 301 https://xn----8sbkccshgr4ce9k.xn--p1ai$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name xn----8sbkccshgr4ce9k.xn--p1ai;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/xn----8sbkccshgr4ce9k.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----8sbkccshgr4ce9k.xn--p1ai/privkey.pem;

    # Сжатие текстовых ответов (HTML без него отдавался как есть)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript text/javascript image/svg+xml application/manifest+json;

    # /index.php — дубль главной страницы
    if ($request_uri ~* "^/index\.php") {
        return 301 /;
    }

    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Laravel настройки
    root /var/www/html/public;
    index index.php index.html;
    
    # Основные правила
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP обработка
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }
    
    # Безопасность
    location ~ /\.ht {
        deny all;
    }
    
    # Статические файлы (с fallback на index.php для виртуальных роутов
    # вроде /livewire/livewire.js, которых нет физически на диске)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}